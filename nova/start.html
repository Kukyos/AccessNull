<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root { --paper: #FBFBFD; --ink: #1C1B22; --muted: #6B6A75; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  .orb { width: 132px; height: 132px; margin: 0 auto 40px; border-radius: 50%; position: relative;
    background: conic-gradient(from 0deg, #FFD60A, #FF9F0A, #FF375F, #BF5AF2, #0A84FF, #FFD60A); animation: breathe 5s ease-in-out infinite; }
  .orb::after { content: ""; position: absolute; inset: 34px; border-radius: 50%; background: var(--paper); }
  @keyframes breathe { 50% { transform: scale(.94); } }
  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.1; margin: 0 0 18px; letter-spacing: -.02em; }
  p { font-size: 20px; color: var(--muted); margin: 0; line-height: 1.5; }
  kbd { font: inherit; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>What would you like to do?</h1>
  <p>Say <kbd>“Nova,”</kbd> and then what you want. Or type it in the address bar.</p>
</main>
</body>
</html>
