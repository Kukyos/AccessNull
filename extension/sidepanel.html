<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AccessNull</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <h1>Access<span>Null</span></h1>
  <p class="tag">Say what you want done.</p>
</header>

<button id="mic" class="mic" aria-pressed="false" aria-describedby="heard">
  <span class="ring" aria-hidden="true"></span>
  <span id="micLabel">Start listening</span>
</button>
<p id="heard" class="heard" aria-live="polite">Press the button or Alt+Shift+A, then speak.</p>

<form id="goalForm" class="goal">
  <label for="goal" class="sr">Or type a request</label>
  <input id="goal" autocomplete="off" placeholder="Or type: find the cheapest steel bottle…">
  <button type="submit">Go</button>
</form>

<section id="confirm" class="confirm" hidden aria-live="assertive">
  <p id="confirmQ"></p>
  <div>
    <button id="yes" class="yes">Yes, go ahead</button>
    <button id="no" class="no">No</button>
  </div>
</section>

<div class="bar">
  <button id="stop" class="stop" hidden>Stop</button>
  <button id="numbers" class="ghost">Show numbers</button>
</div>

<ol id="log" class="log" aria-live="polite" aria-label="What AccessNull is doing"></ol>

<details id="settings">
  <summary>Settings</summary>
  <form id="settingsForm">
    <label>Groq API key <input name="groqKey" type="password" autocomplete="off" placeholder="gsk_…"></label>
    <label>ElevenLabs API key <input name="elevenKey" type="password" autocomplete="off" placeholder="optional: natural voice"></label>
    <label>ElevenLabs voice ID <input name="voiceId" placeholder="21m00Tcm4TlvDq8EGXA3"></label>
    <label>Language
      <select name="lang">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी Hindi</option>
        <option value="ta-IN">தமிழ் Tamil</option>
        <option value="kn-IN">ಕನ್ನಡ Kannada</option>
        <option value="te-IN">తెలుగు Telugu</option>
      </select>
    </label>
    <label>Speech speed <input name="rate" type="number" min="0.7" max="1.6" step="0.1" placeholder="1"></label>
    <label>Planner model <input name="model" placeholder="llama-3.3-70b-versatile"></label>
    <label>Vision model <input name="visionModel" placeholder="meta-llama/llama-4-scout-17b-16e-instruct"></label>
    <button type="submit">Save</button>
    <span id="saved" aria-live="polite"></span>
  </form>
</details>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
