<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova settings · AccessNull</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
<h1>Nova</h1>
<p>Press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> on any page and say what you want done. Say "stop" or press Esc to cancel.</p>
<form id="settingsForm">
    <label>AI API base URL <input name="apiBase" placeholder="https://router.speko.dev/v1 (any OpenAI-compatible API)"></label>
    <label>AI API key <input name="apiKey" type="password" autocomplete="off" placeholder="gsk_… / sk-…"></label>
    <label>ElevenLabs API key <input name="elevenKey" type="password" autocomplete="off" placeholder="optional: natural voice"></label>
    <label>ElevenLabs voice ID <input name="voiceId" placeholder="EXAVITQu4vr4xnSDxMaL (Sarah)"></label>
    <label>Language
      <select name="lang">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी Hindi</option>
        <option value="ta-IN">தமிழ் Tamil</option>
        <option value="kn-IN">ಕನ್ನಡ Kannada</option>
        <option value="te-IN">తెలుగు Telugu</option>
      </select>
    </label>
    <label>Speech speed <input name="rate" type="number" min="0.7" max="1.6" step="0.1" placeholder="1"></label>
    <label>Planner model <input name="model" placeholder="anthropic/claude-haiku-5-5"></label>
    <label>Smarter model (“use a smarter model”) <input name="smartModel" placeholder="anthropic/claude-sonnet-5"></label>
    <label>Vision model <input name="visionModel" placeholder="meta-llama/llama-4-scout-17b-16e-instruct"></label>
    <button type="submit">Save</button>
    <span id="saved" aria-live="polite"></span>
  </form>
  <section class="tx">
    <h2>Transcript</h2>
    <p>Everything Nova heard, said and decided, kept on this computer only (last 3000 lines).</p>
    <div class="row"><button id="dl" type="button">Download</button><button id="clear" type="button" class="ghost">Clear</button></div>
    <pre id="log" tabindex="0" aria-label="Transcript"></pre>
  </section>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
